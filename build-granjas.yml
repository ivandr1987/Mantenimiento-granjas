            else if(a=='eq'){V={n:'eq',g:+el.dataset.g,e:el.dataset.e};render();window.scrollTo(0,0)}
            else if(a=='back'){V={n:'home'};render()}
            else if(a=='reg')openSh(el.dataset.t);
            else if(a=='editg')openFarm(+el.dataset.g);
            else if(a=='fd')editDatos(el.dataset.f);
            else if(a=='fadd')addItem(el.dataset.k);
            else if(a=='fedit')editItem(el.dataset.i);
            else if(a=='fdef')defComps();
            else if(a=='go'){V={n:el.dataset.v};render();window.scrollTo(0,0)}
            else if(a=='stscan')startScan('bar');
            else if(a=='stnew')newRep('');
            else if(a=='stedit')editRep(el.dataset.i);
            else if(a=='fix')db.collection('registros').doc(el.dataset.id).update({fest:'ok',fsf:hoy(),fsp:U.email}).catch(fer);
            else if(a=='mkpdf')mkPdf();
            else if(a=='addg'){var n=parseInt($('#ng').value,10);if(!n||n<1){toast('Poné un número válido',1);return}
              if(G.some(function(g){return g.numero==n})){toast('Esa granja ya existe',1);return}
              db.collection('granjas').doc(String(n)).set({numero:n,nombre:$('#nn').value.trim()}).catch(function(x){toast('Error: '+x.message,1)});toast('Granja '+n+' agregada')}
            else if(a=='qr'){qrPerm().then(function(){return qrSave(V.g,V.e)}).then(function(){toast('QR guardado en Documentos/Granjas/QR')}).catch(function(x){toast(x.message||'No se pudo guardar',1)})}
            else if(a=='qrall'){qrPerm().then(function(){var p=Promise.resolve();G.forEach(function(g){['solar','grupo'].forEach(function(e){p=p.then(function(){return qrSave(g.numero,e)})})});return p}).then(function(){toast('QR guardados en Documentos/Granjas/QR')}).catch(function(x){toast(x.message||'No se pudo guardar',1)})}
          };
          window.addEventListener('online',render);window.addEventListener('offline',render);
          render();
          </script></body></html>
