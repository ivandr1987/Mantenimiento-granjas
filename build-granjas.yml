name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Compilar APK
        run: |
          mkdir -p www
          cat > package.json <<'EOF'
          {
            "name": "granjas",
            "version": "1.0.0",
            "private": true,
            "dependencies": {
              "@capacitor/core": "^6.1.0",
              "@capacitor/android": "^6.1.0",
              "@capacitor/cli": "^6.1.0",
              "@capacitor/filesystem": "^6.0.0",
              "@capacitor/share": "^6.0.0"
            }
          }
          EOF
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.granjas.mantenimiento",
            "appName": "CyM GP",
            "webDir": "www"
          }
          EOF
          cat > www/index.html <<'EOF'
          <!DOCTYPE html>
          <html lang="es"><head><meta charset="utf-8">
          <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
          <title>Granjas</title>
          <style>
          :root{--bg:#EEF1F5;--c:#fff;--ink:#12202F;--mut:#5d6b7a;--ln:#d5dce4;--acc:#E8A33D;--bad:#d64541;--ok:#1f9d57;--wa:#e0a100;--na:#9aa5b1;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
          @media(prefers-color-scheme:dark){:root{--bg:#0f1620;--c:#18222f;--ink:#e8edf3;--mut:#93a1b0;--ln:#2a3746}}
          *{box-sizing:border-box}
          body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,sans-serif}
          header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:#12202F;color:#fff;padding:12px 14px;display:flex;align-items:center;gap:10px}
          header h1{margin:0;font-size:19px;flex:1}
          header small{color:#f3c677;font-size:12px}
          header button{background:none;border:1px solid #556;color:#fff;border-radius:8px;padding:6px 10px;font-size:13px}
          main{padding:14px;max-width:640px;margin:0 auto}
          .card{background:var(--c);border:1px solid var(--ln);border-radius:10px;padding:12px;margin-bottom:12px}
          h2{font-size:18px;margin:0 0 8px}
          label{display:block;font-size:13px;color:var(--mut);margin:8px 0 3px}
          input,textarea,select{width:100%;padding:11px;border:1px solid var(--ln);border-radius:8px;background:var(--bg);color:var(--ink);font:16px system-ui,sans-serif}
          .row{display:flex;gap:8px;align-items:center}.row>*{flex:1}.row>.fit{flex:none}
          .b{background:var(--acc);color:#12202F;border:0;border-radius:8px;padding:13px 14px;font:700 16px system-ui,sans-serif;width:100%;margin-top:8px}
          .b.s{background:transparent;border:1px solid var(--ln);color:var(--ink);font-weight:600}
          .b.fit{width:auto;margin:0}
          .chip{flex:1;display:flex;align-items:center;gap:8px;padding:12px;border:1px solid var(--ln);border-radius:8px;background:var(--c);color:var(--ink);font:600 15px system-ui,sans-serif}
          .dot{width:14px;height:14px;border-radius:50%;background:var(--na);flex:none}
          .ok{background:var(--ok)}.wa{background:var(--wa)}.bad{background:var(--bad)}
          .mut,small{color:var(--mut);font-size:13px}
          .line{padding:9px 0;border-top:1px solid var(--ln)}.line:first-of-type{border-top:0}
          .pend{color:var(--wa);font-size:12px;font-weight:700}
          #scanbox{display:none;position:sticky;top:calc(env(safe-area-inset-top,0px) + 50px);z-index:4;background:#000;padding:8px}
          #sh{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:20;display:none;overflow:auto;padding:14px}
          #sh .card{max-width:520px;margin:0 auto}
          #toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:#12202F;color:#fff;padding:11px 16px;border-radius:10px;z-index:30;display:none;max-width:90%;text-align:center}
          #toast.bad{background:var(--bad)}
          </style></head>
          <body>
          <header><h1>Granjas <small>v__BUILD__</small></h1><small id="st"></small><button id="out" style="display:none">Salir</button></header>
          <div id="scanbox"><div id="reader"></div><button class="b s" id="stopscan" style="color:#fff">Cerrar cámara</button></div>
          <main id="app"></main>
          <div id="sh"></div><div id="toast"></div>
          <script src="firebase-app-compat.js"></script>
          <script src="firebase-auth-compat.js"></script>
          <script src="firebase-firestore-compat.js"></script>
          <script src="qrcode.min.js"></script>
          <script src="html5-qrcode.min.js"></script>
          <script src="jspdf.umd.min.js"></script>
          <script>
          firebase.initializeApp({apiKey:"AIzaSyAIEVVLabksP3BsYKozMuCQNTWcWHW9bKo",authDomain:"control-mantenimiento-b12e0.firebaseapp.com",projectId:"control-mantenimiento-b12e0",storageBucket:"control-mantenimiento-b12e0.firebasestorage.app",messagingSenderId:"344981212722",appId:"1:344981212722:web:af69c53ba227b89765f62b"});
          var auth=firebase.auth(),db=firebase.firestore();
          db.enablePersistence({synchronizeTabs:false}).catch(function(){});
          var G=[],R=[],F={},RP=[],U=null,V={n:'home'},un=[],sh=null;
          var EQ={solar:'Solar',grupo:'Grupo electrógeno'},TL={mantenimiento:'Mantenimiento',servicio:'Servicio de motor'};
          var $=function(s){return document.querySelector(s)};
          function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
          var tt;function toast(m,bad){var t=$('#toast');t.textContent=m;t.className=bad?'bad':'';t.style.display='block';clearTimeout(tt);tt=setTimeout(function(){t.style.display='none'},2200)}
          function hoy(){var d=new Date();return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2)}
          function fd(f){var p=f.split('-');return p[2]+'/'+p[1]+'/'+p[0]}
          function dias(f){return Math.floor((Date.now()-new Date(f+'T12:00:00').getTime())/864e5)}
          function last(g,e,t){for(var i=0;i<R.length;i++){var r=R[i];if(r.granja==g&&r.equipo==e&&(!t||r.tipo==t))return r}}
          var RK={na:0,ok:1,wa:2,bad:3},RN=['na','ok','wa','bad'];
          function est(g,e){
            var l=last(g,e,'mantenimiento'),c='na',ls=[];
            if(!l)ls.push('Sin mantenimientos registrados');
            else{var d=dias(l.fecha),k=d<23?'ok':d<=30?'wa':'bad';c=k;ls.push('Último mantenimiento: '+fd(l.fecha)+' (hace '+d+' d)')}
            if(e=='grupo'){
              var s=last(g,e,'servicio'),h=null;for(var i=0;i<R.length;i++){if(R[i].granja==g&&R[i].equipo==e&&R[i].horas!=null){h=R[i].horas;break}}
              if(!s||s.horas==null)ls.push('Sin servicio de motor registrado');
              else{var u=(h==null?s.horas:h)-s.horas,k2=u>=500?'bad':u>=450?'wa':'ok';if(RK[k2]>RK[c])c=k2;ls.push('Servicio de motor: '+u+' / 500 hs desde el último ('+fd(s.fecha)+')')}
              if(h!=null)ls.push('Horómetro actual: '+h+' hs');
              var nb=0,cc='na';items(g,e,'comp').forEach(function(x){var k3=cst(x,h).c;if(k3=='bad')nb++;if(RK[k3]>RK[cc])cc=k3});
              if(RK[cc]>RK[c])c=cc;if(nb)ls.push(nb+(nb>1?' componentes vencidos':' componente vencido'));
            }
            return{c:c,ls:ls};
          }
          /* datos */
          function unsub(){un.forEach(function(f){f()});un=[]}
          function listen(){unsub();
            un.push(db.collection('granjas').onSnapshot(function(s){G=s.docs.map(function(d){return d.data()}).sort(function(a,b){return a.numero-b.numero});render()},function(){}));
            un.push(db.collection('registros').onSnapshot({includeMetadataChanges:true},function(s){R=s.docs.map(function(d){var x=d.data();x.id=d.id;x.pend=d.metadata.hasPendingWrites;return x}).sort(function(a,b){return a.fecha<b.fecha?1:a.fecha>b.fecha?-1:b.ts-a.ts});render()},function(){}));
            un.push(db.collection('fichas').onSnapshot(function(s){F={};s.docs.forEach(function(d){F[d.id]=d.data()});render()},function(){}));
            un.push(db.collection('repuestos').onSnapshot(function(s){RP=s.docs.map(function(d){var x=d.data();x.id=d.id;return x}).sort(function(a,b){return String(a.nombre).localeCompare(String(b.nombre))});render()},function(){}));
          }
          auth.onAuthStateChanged(function(u){U=u;if(u)listen();else{unsub();G=[];R=[]}render()});
          /* vistas */
          function render(){
            var p=R.filter(function(r){return r.pend}).length;
            $('#st').textContent=(navigator.onLine?'':'Sin conexión')+(p?(navigator.onLine?'':' · ')+p+' sin sincronizar':'');
            $('#out').style.display=U?'block':'none';
            if(sh)return;
            var h=!U?vLogin():V.n=='eq'?vEq():V.n=='panel'?vPanel():V.n=='stock'?vStock():V.n=='pdf'?vPdf():vHome();
            $('#app').innerHTML=h;
            if(U&&V.n=='eq'){var q=$('#qr');if(q&&window.QRCode)new QRCode(q,{text:'granja:'+V.g+':'+V.e,width:170,height:170})}
          }
          function vLogin(){return '<div class="card"><h2>Ingresar</h2><label for="em">Correo</label><input id="em" type="email" autocomplete="username"><label for="pw">Contraseña</label><input id="pw" type="password" autocomplete="current-password"><button class="b" data-a="login">Ingresar</button></div>'}
          function vHome(){
            var lw=RP.filter(low).length,h='<button class="b" data-a="scan" style="margin:0 0 12px">Escanear QR</button><div class="row" style="margin-bottom:12px"><button class="b s" data-a="go" data-v="panel" style="margin:0">Resumen</button><button class="b s" data-a="go" data-v="stock" style="margin:0">Repuestos'+(lw?' ('+lw+'!)':'')+'</button><button class="b s" data-a="go" data-v="pdf" style="margin:0">PDF</button></div>';
            G.forEach(function(g){
              h+='<div class="card"><div class="row"><h2 style="margin:0">Granja '+g.numero+(g.nombre?' <small>· '+esc(g.nombre)+'</small>':'')+'</h2><button class="b s fit" data-a="editg" data-g="'+g.numero+'" style="margin:0;padding:8px 12px;font-size:14px">Editar</button></div><div class="row" style="margin-top:10px">';
              ['solar','grupo'].forEach(function(e){h+='<button class="chip" data-a="eq" data-g="'+g.numero+'" data-e="'+e+'"><i class="dot '+est(g.numero,e).c+'"></i>'+(e=='solar'?'Solar':'Grupo')+'</button>'});
              h+='</div></div>';
            });
            if(!G.length)h+='<p class="mut">Todavía no hay granjas. Agregá la primera.</p>';
            h+='<div class="card"><h2>Agregar granja</h2><input id="ng" inputmode="numeric" placeholder="N° de granja"><input id="nn" placeholder="Nombre o ubicación (opcional)" style="margin-top:8px"><button class="b" data-a="addg">Agregar</button></div>';
            if(G.length)h+='<button class="b s" data-a="qrall">Guardar QR de todas las granjas</button>';
            return h;
          }
          function vEq(){
            var g=V.g,e=V.e,s=est(g,e);
            var h='<button class="b s" data-a="back" style="margin:0 0 12px">← Volver</button><div class="card"><h2><i class="dot '+s.c+'" style="display:inline-block;vertical-align:middle;margin-right:8px"></i>Granja '+g+' – '+EQ[e]+'</h2>'+(gn(g)?'<div class="mut">'+esc(gn(g))+'</div>':'')+s.ls.map(function(x){return '<div class="mut">'+esc(x)+'</div>'}).join('')+
            '<button class="b" data-a="reg" data-t="mantenimiento">Mantenimiento realizado</button>'+(e=='grupo'?'<button class="b" data-a="reg" data-t="servicio">Servicio de motor</button>':'')+'</div>';
            h+=vFicha(g,e);h+='<div class="card"><h2>Historial</h2>';
            var hs=R.filter(function(r){return r.granja==g&&r.equipo==e});
            if(!hs.length)h+='<p class="mut">Sin registros.</p>';
            hs.forEach(function(r){h+='<div class="line"><b>'+fd(r.fecha)+' · '+(TL[r.tipo]||r.tipo)+'</b>'+(r.pend?' <span class="pend">sin sincronizar</span>':'')+'<br><small>'+esc(r.por||'')+(r.horas!=null?' · '+r.horas+' hs':'')+'</small>'+
              [['obs','Observaciones'],['otro','Otro trabajo'],['fe','Fallo encontrado'],['fs','Fallo solucionado'],['vb','Tensión de batería (V)'],['lv','Luz de válvulas (mm)'],['vc','Tensión de carga (V)']].map(function(k){return r[k[0]]?'<div>'+k[1]+': '+esc(r[k[0]])+'</div>':''}).join('')+(r.camb&&r.camb.length?'<div>Componentes cambiados: '+esc(r.camb.join(', '))+'</div>':'')+(r.rep&&r.rep.length?'<div>Repuestos usados: '+esc(r.rep.map(function(x){return x.n+' ×'+x.q}).join(', '))+'</div>':'')+'</div>'});
            h+='</div><div class="card"><h2>Código QR</h2><div id="qr"></div><button class="b s" data-a="qr">Guardar QR en Documentos</button></div>';
            return h;
          }
          /* registro */
          function openSh(t){
            sh=t;var e=V.e,l=last(V.g,e),hp=l&&l.horas!=null?'Último: '+l.horas+' hs':'';
            var h='<div class="card"><h2>'+TL[t]+' – Granja '+V.g+' '+EQ[V.e]+'</h2><label for="f">Fecha</label><input id="f" type="date" value="'+hoy()+'">';
            if(e=='grupo')h+='<label for="hs">Horómetro (hs) *</label><input id="hs" inputmode="decimal" placeholder="'+hp+'">';
            h+=extra(t);if(e=='grupo')h+=usedBox();h+='<label for="o1">Observaciones (opcional)</label><textarea id="o1" rows="2"></textarea><label for="o2">Otro trabajo realizado (opcional)</label><textarea id="o2" rows="2"></textarea><label for="o3">Fallo encontrado (opcional)</label><textarea id="o3" rows="2"></textarea><label for="o4">Fallo solucionado (opcional)</label><textarea id="o4" rows="2"></textarea><button class="b" data-a="save">Guardar</button><button class="b s" data-a="cancel">Cancelar</button></div>';
            $('#sh').innerHTML=h;$('#sh').style.display='block';
          }
          function closeSh(){sh=null;$('#sh').style.display='none';render()}
          function saveReg(){
            var f=$('#f').value;if(!f){toast('Falta la fecha',1);return}
            var o={granja:V.g,equipo:V.e,tipo:sh,fecha:f,ts:Date.now(),por:U.email,obs:$('#o1').value.trim(),otro:$('#o2').value.trim(),fe:$('#o3').value.trim(),fs:$('#o4').value.trim()};
            if(V.e=='grupo'){var hs=parseFloat(String($('#hs').value).replace(',','.'));if(isNaN(hs)){toast('Cargá el horómetro',1);return}o.horas=hs}
            saveExtra(o,f);
            db.collection('registros').add(o).catch(function(x){toast('Error: '+x.message,1)});
            var off=!navigator.onLine;closeSh();toast(off?'Guardado. Se sincroniza al volver la señal':'Guardado');
          }
          function gn(n){var f=G.filter(function(x){return x.numero==n})[0];return f&&f.nombre?f.nombre:''}
          function runOps(ops){for(var i=0;i<ops.length;i+=400){var b=db.batch();ops.slice(i,i+400).forEach(function(f){f(b)});b.commit().catch(function(x){toast('Error: '+x.message,1)})}}
          function openFarm(n){
            var f=G.filter(function(x){return x.numero==n})[0];if(!f)return;
            sh='farm';V.ef=n;
            $('#sh').innerHTML='<div class="card"><h2>Editar granja '+n+'</h2><label for="en">Número</label><input id="en" inputmode="numeric" value="'+n+'"><small>Si cambiás el número, el historial pasa a la nueva numeración y hay que volver a imprimir los QR de esta granja.</small><label for="enm">Nombre o ubicación</label><input id="enm" value="'+esc(f.nombre||'')+'"><button class="b" data-a="gsave">Guardar cambios</button><button class="b s" data-a="gdel" style="color:var(--bad);border-color:var(--bad)">Eliminar granja</button><button class="b s" data-a="cancel">Cancelar</button></div>';
            $('#sh').style.display='block';
          }
          function saveFarm(){
            var old=V.ef,n=parseInt($('#en').value,10),nm=$('#enm').value.trim();
            if(!n||n<1){toast('Número inválido',1);return}
            if(n!=old&&G.some(function(g){return g.numero==n})){toast('Ya existe la granja '+n,1);return}
            var ops=[];
            if(n==old)ops.push(function(b){b.set(db.collection('granjas').doc(String(old)),{numero:old,nombre:nm})});
            else{
              ops.push(function(b){b.set(db.collection('granjas').doc(String(n)),{numero:n,nombre:nm})});
              ops.push(function(b){b.delete(db.collection('granjas').doc(String(old)))});
              R.filter(function(r){return r.granja==old}).forEach(function(r){ops.push(function(b){b.update(db.collection('registros').doc(r.id),{granja:n})})});
              ['solar','grupo'].forEach(function(e){var fo=F[fid(old,e)];if(fo){ops.push(function(b){b.set(db.collection('fichas').doc(fid(n,e)),fo)});ops.push(function(b){b.delete(db.collection('fichas').doc(fid(old,e)))})}});
            }
            runOps(ops);closeSh();toast(n==old?'Cambios guardados':'Granja renumerada. Reimprimí sus QR');
          }
          function delFarm(){
            var old=V.ef,rs=R.filter(function(r){return r.granja==old});
            if(!confirm('¿Eliminar la Granja '+old+' y sus '+rs.length+' registros? No se puede deshacer.'))return;
            var ops=[function(b){b.delete(db.collection('granjas').doc(String(old)))}];
            ['solar','grupo'].forEach(function(e){ops.push(function(b){b.delete(db.collection('fichas').doc(fid(old,e)))})});
            rs.forEach(function(r){ops.push(function(b){b.delete(db.collection('registros').doc(r.id))})});
            runOps(ops);closeSh();toast('Granja '+old+' eliminada');
          }
          /* fichas */
          var FM=null,NUMF={q:1,stk:1,min:1,pot:1,cap:1,volt:1,vcarga:1,cant:1,horas:1,intHs:1,intMes:1,kva:1,aceiteL:1,refL:1,pCant:1,pPot:1};
          var D='inputmode="decimal"',DT='type="date"';
          var FD={
           ds:[['pCant','Cantidad de paneles',D],['pPot','Potencia por panel (W)',D]],
           inv:[['marca','Marca'],['modelo','Modelo'],['pot','Potencia (kW)',D],['serie','N° de serie'],['fecha','Fecha de instalación',DT]],
           bat:[['tipo','Tipo (gel, litio, plomo…)'],['marca','Marca'],['modelo','Modelo'],['cap','Capacidad (Ah)',D],['volt','Voltaje (V)',D],['vcarga','Tensión de carga (V)',D],['serie','N° de serie'],['fecha','Fecha de instalación',DT]],
           comp:[['nombre','Componente'],['ref','Referencia / modelo'],['cant','Cantidad',D],['fecha','Fecha del último cambio',DT],['horas','Horómetro en ese cambio (hs)',D],['intHs','Cambiar cada (hs)',D],['intMes','Cambiar cada (meses)',D]],
           dg:[['marca','Marca'],['modelo','Modelo'],['kva','Potencia (kVA)',D],['comb','Combustible'],['serie','N° de serie'],['aceiteTipo','Aceite: tipo'],['aceiteL','Aceite: litros',D],['refTipo','Refrigerante: tipo'],['refL','Refrigerante: litros',D],['altFecha','Alternador: último cambio o reparación',DT],['altNota','Alternador: nota'],['arrFecha','Motor de arranque: último cambio o reparación',DT],['arrNota','Motor de arranque: nota']]
          };
          function fid(g,e){return g+'-'+e}
          function fi(g,e){var f=F[fid(g,e)];return f&&f.items?f.items:{}}
          function fdat(g,e){var f=F[fid(g,e)];return f&&f.datos?f.datos:{}}
          function items(g,e,k){var it=fi(g,e);return Object.keys(it).map(function(i){var x=it[i];x.id=i;return x}).filter(function(x){return x.k==k}).sort(function(a,b){return(a.ord||0)-(b.ord||0)})}
          function hor(g,e){for(var i=0;i<R.length;i++)if(R[i].granja==g&&R[i].equipo==e&&R[i].horas!=null)return R[i].horas;return null}
          function cst(x,h){
            var k='na',t=[];
            if(x.intHs&&typeof x.horas=='number'&&h!=null){var r=Math.round(x.intHs-(h-x.horas));k=r<=0?'bad':r<=x.intHs*.1?'wa':'ok';t.push(r<=0?'Vencido por horas ('+(-r)+' hs)':'Faltan '+r+' hs')}
            if(x.intMes&&x.fecha){var m=Math.round(x.intMes*30-dias(x.fecha)),k2=m<=0?'bad':m<=30?'wa':'ok';if(RK[k2]>RK[k])k=k2;t.push(m<=0?'Vencido por fecha (hace '+(-m)+' d)':'Faltan '+m+' d')}
            return{c:k,t:t};
          }
          function il(x,h){
            var j=function(a){return esc(a.filter(Boolean).join(' · '))};
            if(x.k=='inv')return '<b>'+j([x.marca,x.modelo])+'</b><br><small>'+j([x.pot?x.pot+' kW':'','S/N '+(x.serie||'—'),x.fecha?'instalado '+fd(x.fecha):''])+'</small>';
